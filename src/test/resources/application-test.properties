
# ==========================================
# SHOPSPHERE - TEST CONFIGURATION
# ==========================================
shopsphere.outbox.enabled=false
# In-memory H2 database for tests only
spring.datasource.url=jdbc:h2:mem:shopsphere_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create and remove the isolated test schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Let Hibernate detect the database dialect automatically
# spring.jpa.database-platform=spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
# KAFKA - TEST CONFIGURATION
# ==========================================

# Disable custom Kafka configuration during tests
app.kafka.enabled=false

# Prevent Kafka listener containers from starting
spring.kafka.listener.auto-startup=false

# ==========================================
# SCHEDULING - TEST CONFIGURATION
# ==========================================

# Attempt to disable scheduled tasks during tests
spring.task.scheduling.enabled=false
