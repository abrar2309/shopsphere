server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info


# ==========================================
# RATE LIMITING
# ==========================================

# Login: 5 attempts per 60 seconds
shopsphere.rate-limit.login.limit=5
shopsphere.rate-limit.login.window-seconds=60

# Product creation: 20 requests per 60 seconds
shopsphere.rate-limit.product-create.limit=20
shopsphere.rate-limit.product-create.window-seconds=60

# Order creation: 10 requests per 60 seconds
shopsphere.rate-limit.order-create.limit=10
shopsphere.rate-limit.order-create.window-seconds=60
logging.level.org.springframework.security=TRACE
logging.level.com.abrar.shopsphere=DEBUG
shopsphere.outbox.enabled=${APP_KAFKA_ENABLED:true}